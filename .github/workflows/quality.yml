name: AQEP quality pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public website URL to analyze
        required: true
        default: https://example.com
        type: string
      enable_ai:
        description: Start Ollama and run local text and vision analysis
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run deterministic tests
        run: mvn -B verify

  website-analysis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AQEP_TARGET_URL: ${{ inputs.target_url }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install project
        run: mvn -B install -DskipTests
      - name: Install Chromium
        run: mvn -B -pl platform-cli exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"
      - name: Install and start Ollama
        if: inputs.enable_ai
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null
      - name: Download local AI models
        if: inputs.enable_ai
        run: |
          ollama pull qwen2.5-coder:7b
          ollama pull deepseek-r1
          ollama pull llava
      - name: Analyze website with local AI
        if: inputs.enable_ai
        run: mvn -B -pl platform-cli exec:java "-Dexec.args=$AQEP_TARGET_URL --max-pages 3 --out artifacts"
      - name: Analyze website without AI
        if: ${{ !inputs.enable_ai }}
        run: mvn -B -pl platform-cli exec:java "-Dexec.args=$AQEP_TARGET_URL --max-pages 3 --out artifacts --no-ai"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqep-analysis
          path: platform-cli/artifacts/
          if-no-files-found: ignore
